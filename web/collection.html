<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <link rel="stylesheet" href="/styles.css">
    <title>Collection | Collection Archive</title>
</head>
<body>
    <nav>
        <a href="/">Collection Archive</a>
    </nav>

    <main>
        <p id="status">Loading collection...</p>

        <article id="collection" hidden>
            <div class="collection-heading">
                <span id="label-monogram" class="label-monogram"></span>
                <h1 id="collection-title"></h1>
            </div>
            <p id="collection-designer"></p>
            <p id="collection-season"></p>
            <p id="collection-status"></p>
            <p id="collection-piece-count"></p>
            <p id="collection-description"></p>
            <section id="collection-media" hidden>
                <h2>Runway media</h2>
                <div id="collection-video" class="video-frame" hidden></div>
                <p id="collection-source"></p>
            </section>
            <p>
                <a id="edit-collection" href="#">
                    Edit collection
                </a>
            </p>
            <p>
                <button id="delete-collection" type="button">
                    Delete collection
                </button>
            </p>
        </article>
    </main>

    <script src="/collection.js" defer></script>
</body>
</html>
