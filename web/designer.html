<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <link rel="stylesheet" href="/styles.css">
    <title>Designer | Collection Archive</title>
</head>
<body>
    <nav class="site-header"><a class="brand" href="/"><span>ONE→MANY</span><small>DESIGN TRANSMISSION ARCHIVE</small></a><div class="signal-stack"><span class="signal"><i></i> LIVE DATABASE <b>CH. 000</b></span><span class="signature">(h)gaines.</span></div></nav><div class="ticker">DESIGNER → LABEL → SEASON → IMAGE → MOVEMENT → MEMORY → DESIGNER → LABEL → SEASON →</div>

    <main>
        <p id="status">Loading designer...</p>

        <section id="profile" hidden>
            <p class="eyebrow">DESIGNER PROFILE / ARCHIVE RECORD</p><h1 id="designer-name"><span id="designer-flag" class="profile-flag"></span><span id="designer-name-text"></span></h1>
            <p id="designer-details"></p>
            <p id="designer-website"></p>
            <p id="designer-biography"></p>

            <div class="actions">
            <p>
                <a id="add-collection-link" href="#">
                    Add a collection
                </a>
            </p>
            <p>
                <a id="edit-designer" href="#">
                    Edit designer
                </a>
            </p>
            <p>
                <button id="delete-designer" type="button">
                    Delete designer
                </button>
            </p>
            </div>
            <h2 class="section-title">Collections</h2>
            <ul id="collection-list" class="collection-list"></ul>
        </section>
    </main>

    <script src="/flags.js" defer></script>
    <script src="/designer.js" defer></script>
</body>
</html>
